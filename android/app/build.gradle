plugins {
    id 'com.android.application'
}

android {
    namespace 'com.browz.mobile'
    compileSdk 34
    useLibrary "android.test.runner"
    useLibrary "android.test.base"

    defaultConfig {
        applicationId "com.browz.mobile"
        minSdk 24
        targetSdk 34
        testInstrumentationRunner "android.test.InstrumentationTestRunner"
        versionCode 103
        versionName "1.0.3"
    }

    signingConfigs {
        release {
            storeFile file("browz-release.p12")
            storePassword "browzstealth2026"
            keyAlias "browzkey"
            keyPassword "browzstealth2026"
            storeType "PKCS12"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Zero third-party SDKs — 100% pure Android SDK for maximum privacy & zero telemetry
}
