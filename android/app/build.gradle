plugins {
    id 'com.android.application'
}

android {
    namespace 'com.browz.mobile'
    compileSdk 34

    defaultConfig {
        applicationId "com.browz.mobile"
        minSdk 24
        targetSdk 34
        versionCode 100
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Zero third-party SDKs — 100% pure Android SDK for maximum privacy & zero telemetry
}
