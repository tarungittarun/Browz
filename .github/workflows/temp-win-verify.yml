name: Temp Windows verify
on:
  workflow_dispatch:
  push:
    branches:
      - arena/906ee2db-browz
    paths:
      - '.github/workflows/temp-win-verify.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Reproducible install from the lockfile
        run: npm ci --no-audit --no-fund
      - name: Report the electron runtime actually installed
        run: |
          npx electron --version | Out-File -Append -Encoding utf8 build-info.txt
          node -p "require('./node_modules/electron/package.json').version" | Out-File -Append -Encoding utf8 build-info.txt
          node -p "require('./node_modules/electron-builder/package.json').version" | Out-File -Append -Encoding utf8 build-info.txt
      - name: Build the Windows installer
        shell: pwsh
        run: |
          npm run build:win *> build-log.txt
          "exit=$LASTEXITCODE" | Out-File -Append -Encoding utf8 build-info.txt
          exit 0
      - name: Record artifact facts
        if: always()
        run: |
          Get-ChildItem dist -Filter *.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$($_.Name) $($_.Length) $h" | Out-File -Append -Encoding utf8 build-info.txt
          }
          Get-Content build-info.txt
      - name: Publish facts to a throwaway branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q temp-info; cd temp-info
          Copy-Item ../build-info.txt .
          if (Test-Path ../build-log.txt) { Copy-Item ../build-log.txt . }
          git checkout -q -b win-build-info
          git add -A
          git -c user.name=b -c user.email=b@x commit -q -m info
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" win-build-info
