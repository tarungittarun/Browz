name: Temp APK export
on:
  push:
    paths:
      - '.github/workflows/temp-apk-export.yml'
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.0.3-preview --pattern 'Browz-Mobile-1.0.3-preview.apk' --clobber
          gh release download v1.0.3-preview --pattern 'SHA256SUMS.txt' --clobber
          sha256sum Browz-Mobile-1.0.3-preview.apk; cat SHA256SUMS.txt
          W=$(mktemp -d); cp Browz-Mobile-1.0.3-preview.apk SHA256SUMS.txt "$W/"; cd "$W"
          git init -q; git checkout -q -b apk-preview; git add .
          git -c user.name=browz-build -c user.email=browz-build@users.noreply.github.com commit -q -m "release asset export"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk-preview
