name: Temp APK export
on:
  push:
    paths:
      - '.github/workflows/temp-apk-export.yml'
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Build and export APK
        run: |
          gradle assembleRelease -p android --no-daemon
          cp android/app/build/outputs/apk/release/app-release.apk Browz-Mobile-1.0.3-preview.apk
          sha256sum Browz-Mobile-1.0.3-preview.apk | tee SHA256SUMS.txt
          W=$(mktemp -d); cp Browz-Mobile-1.0.3-preview.apk SHA256SUMS.txt "$W/"; cd "$W"
          git init -q; git checkout -q -b apk-preview; git add .
          git -c user.name=browz-build -c user.email=browz-build@users.noreply.github.com commit -q -m "temp apk export"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk-preview
