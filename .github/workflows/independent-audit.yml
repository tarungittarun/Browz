name: Independent Zero-Bias Red-Team, UX & Security Audit (38 Jobs / 6 Runners)

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  # ===========================================================================
  # JOBS 1–36: 36-Job Independent Red-Team, Code, UX, Vulnerability & Benchmark
  # Matrix across Linux, Windows, and macOS (capped at max-parallel: 5 runners)
  # ===========================================================================
  audit-jobs-j01-to-j36:
    name: "Audit ${{ matrix.job.id }} (${{ matrix.job.os }}): ${{ matrix.job.name }}"
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        job:
          # Track 1: Static Code Quality, V8 AST & Supply-Chain Integrity
          - { id: 'J01', name: 'ast-syntax-strict', os: 'ubuntu-latest' }
          - { id: 'J02', name: 'supply-chain-zero-bloat', os: 'ubuntu-latest' }
          - { id: 'J03', name: 'memory-leak-cap-audit', os: 'ubuntu-latest' }
          - { id: 'J04', name: 'json-proto-pollution-fuzz', os: 'ubuntu-latest' }
          - { id: 'J05', name: 'payload-dos-boundary', os: 'ubuntu-latest' }
          - { id: 'J06', name: 'state-immutability-concurrency', os: 'windows-latest' }

          # Track 2: Red-Team SSRF, XSS, CSRF & Exploit Penetration Testing
          - { id: 'J07', name: 'ssrf-cloud-metadata-redteam', os: 'ubuntu-latest' }
          - { id: 'J08', name: 'ssrf-ip-obfuscation-bypass', os: 'ubuntu-latest' }
          - { id: 'J09', name: 'ssrf-redirect-loopback-pivot', os: 'ubuntu-latest' }
          - { id: 'J10', name: 'control-plane-proxy-escalation', os: 'ubuntu-latest' }
          - { id: 'J11', name: 'xss-script-breakout-redteam', os: 'windows-latest' }
          - { id: 'J12', name: 'csrf-path-traversal-redteam', os: 'macos-latest' }

          # Track 3: Anti-Fingerprinting, CreepJS Native Cloaking & Untraceability
          - { id: 'J13', name: 'creepjs-native-tostring-cloaking', os: 'ubuntu-latest' }
          - { id: 'J14', name: 'window-global-enumeration-stealth', os: 'ubuntu-latest' }
          - { id: 'J15', name: 'canvas-audio-rects-deterministic-entropy', os: 'ubuntu-latest' }
          - { id: 'J16', name: 'webrtc-clienthints-timezone-leak-zero', os: 'windows-latest' }
          - { id: 'J17', name: 'url-tracker-stripper-35params', os: 'ubuntu-latest' }
          - { id: 'J18', name: 'header-sanitization-doh-privacy', os: 'macos-latest' }

          # Track 4: Live Control Impact (Wi-Fi/Radio, Disk/Stream I/O, Containers, Exporters)
          - { id: 'J19', name: 'wifi-radio-5profiles-live-impact', os: 'ubuntu-latest' }
          - { id: 'J20', name: 'disk-stream-io-firewall-live-impact', os: 'ubuntu-latest' }
          - { id: 'J21', name: 'multi-container-cookie-isolation', os: 'windows-latest' }
          - { id: 'J22', name: 'hardware-permission-firewall-matrix', os: 'ubuntu-latest' }
          - { id: 'J23', name: 'download-interceptor-dangerous-ext', os: 'ubuntu-latest' }
          - { id: 'J24', name: 'exporter-security-csv-jmx-har-k6', os: 'ubuntu-latest' }

          # Track 5: UX, Website Loading, Click Compatibility & Video Fit-to-Screen
          - { id: 'J25', name: 'ux-dom-layout-fullbleed-audit', os: 'ubuntu-latest' }
          - { id: 'J26', name: 'ux-button-link-click-interception', os: 'ubuntu-latest' }
          - { id: 'J27', name: 'ux-video-fit-fullscreen-engine', os: 'windows-latest' }
          - { id: 'J28', name: 'ux-transient-retry-error-recovery', os: 'ubuntu-latest' }
          - { id: 'J29', name: 'ux-external-page-api-isolation', os: 'ubuntu-latest' }
          - { id: 'J30', name: 'ux-desktop-electron-preload-ipc-isolation', os: 'windows-latest' }

          # Track 6: Android Mobile Native Audit, Stress Benchmark & Competitive Gate
          - { id: 'J31', name: 'mobile-manifest-os-isolation-audit', os: 'ubuntu-latest' }
          - { id: 'J32', name: 'mobile-webview-bridge-privilege-audit', os: 'ubuntu-latest' }
          - { id: 'J33', name: 'mobile-os-privacy-autofill-ime-wipe', os: 'ubuntu-latest' }
          - { id: 'J34', name: 'mobile-desktop-24point-parity-audit', os: 'ubuntu-latest' }
          - { id: 'J35', name: 'high-concurrency-stress-benchmark', os: 'ubuntu-latest' }
          - { id: 'J36', name: 'competitive-matrix-superiority-gate', os: 'macos-latest' }

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute Independent Red-Team Audit Job (${{ matrix.job.id }})
        run: node test/independent-audit.js --job=${{ matrix.job.id }}

  # ===========================================================================
  # JOB 37: Android Mobile APK Bytecode, DEX, Manifest & Signature Deep Audit
  # (Runs on 6th concurrent runner alongside the 5 matrix runners)
  # ===========================================================================
  mobile-apk-bytecode-and-dex-audit:
    name: "Audit J37 (android-sdk): Native APK Bytecode, DEX & Manifest Deep Inspection"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Compile Release APK, Verify Cryptographic Signature, Audit Manifest & Inspect DEX Bytecode
        run: |
          set -e
          gradle assembleRelease -p android --no-daemon
          cp android/app/build/outputs/apk/release/app-release.apk /tmp/Browz-Audit.apk
          ls -lh /tmp/Browz-Audit.apk

          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          echo "=== 1. Verify APK Cryptographic Signature (v1/v2/v3) ==="
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose /tmp/Browz-Audit.apk

          echo "=== 2. Verify Compiled Binary APK Permissions (Must ONLY be INTERNET) ==="
          PERMS=$("$BUILD_TOOLS_DIR/aapt" dump permissions /tmp/Browz-Audit.apk)
          echo "$PERMS"
          if echo "$PERMS" | grep -E "ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|CAMERA|RECORD_AUDIO|READ_CONTACTS|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|BLUETOOTH"; then
            echo "FAIL: Forbidden hardware/OS tracking permission found in compiled APK!"
            exit 1
          fi
          PERM_COUNT=$(echo "$PERMS" | grep -c "uses-permission:" || true)
          if [ "$PERM_COUNT" -ne 1 ]; then
            echo "FAIL: Expected exactly 1 uses-permission (INTERNET), got $PERM_COUNT"
            exit 1
          fi

          echo "=== 3. Inspect Compiled classes.dex Bytecode Strings ==="
          unzip -p /tmp/Browz-Audit.apk classes.dex > /tmp/classes.dex
          strings /tmp/classes.dex | grep -q "escapeHtmlForMobile"
          strings /tmp/classes.dex | grep -q "escapeJsStringForMobile"
          strings /tmp/classes.dex | grep -q "markNative"
          strings /tmp/classes.dex | grep -q "removeAllCookies"
          strings /tmp/classes.dex | grep -q "deleteAllData"
          echo "PASS: Native Android APK bytecode, DEX strings & binary manifest passed all independent checks!"

  # ===========================================================================
  # JOB 38: Final Independent Auditor Sign-Off Gate & Scorecard Summary
  # ===========================================================================
  independent-auditor-final-gate:
    name: "Audit J38 (final-gate): Complete 36-Job + 21-Suite Independent Sign-Off"
    runs-on: ubuntu-latest
    needs:
      - audit-jobs-j01-to-j36
      - mobile-apk-bytecode-and-dex-audit
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute Full Combined Suite & Write Independent Audit Report
        run: |
          npm test
          echo "## 🛡️ Browz Independent Zero-Bias Audit Scorecard (38 Jobs / 6 Concurrent Runners)" >> $GITHUB_STEP_SUMMARY
          echo "- **Track 1 (J01–J06)**: Static Code Quality, V8 AST & Supply-Chain Integrity — **6/6 PASS**" >> $GITHUB_STEP_SUMMARY
          echo "- **Track 2 (J07–J12)**: Red-Team SSRF, IPv6/Hex/Octal/Decimal Bypass, Redirect-to-Loopback, XSS & CSRF — **6/6 PASS**" >> $GITHUB_STEP_SUMMARY
          echo "- **Track 3 (J13–J18)**: Anti-Fingerprinting, CreepJS \`Function.prototype.toString\` Native Cloaking & Zero-Leak — **6/6 PASS**" >> $GITHUB_STEP_SUMMARY
          echo "- **Track 4 (J19–J24)**: Live Wi-Fi/Radio, Disk/Stream I/O Firewall, Multi-Container & Formula-Safe Exporters — **6/6 PASS**" >> $GITHUB_STEP_SUMMARY
          echo "- **Track 5 (J25–J30)**: UX, Full-Bleed Layout, Link/Button Clickability, Video Fit & Electron Sandbox — **6/6 PASS**" >> $GITHUB_STEP_SUMMARY
          echo "- **Track 6 (J31–J37)**: Android Native DEX/APK Bytecode Audit, Stress Benchmark & 30-Point Competitive Gate — **7/7 PASS**" >> $GITHUB_STEP_SUMMARY
          echo "- **Final Gate (J38)**: All 21 E2E Suites + 36 Red-Team Jobs + Android Bytecode Inspector — **PASS**" >> $GITHUB_STEP_SUMMARY
