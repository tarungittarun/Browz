name: Build Android Mobile APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run automated regression checks
        run: npm test

      - name: Setup JDK 17 for Android SDK 34
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build APK (signed with the historical test key)
        run: |
          set -o pipefail
          if ! gradle assembleRelease -p android --no-daemon 2>&1 | tee /tmp/build.log; then
            grep -E "error:|FAILURE|Execution failed" /tmp/build.log | head -n 25 | tr -d '\r' | while IFS= read -r line; do
              echo "::error title=javac::$line"
            done
            exit 1
          fi
          cp android/app/build/outputs/apk/release/app-release.apk Browz-Mobile-1.0.3-preview.apk
          ls -lh Browz-Mobile-1.0.3-preview.apk

      - name: Strict artifact verification (permissions, manifest, signature, contents)
        env:
          # Preview only: the exposed historical key is tolerated for test builds and
          # reported as a warning. Remove this env for any trusted release.
          BROWZ_ALLOW_EXPOSED_KEY: "1"
        run: ./test/verify-apk.sh Browz-Mobile-1.0.3-preview.apk

      - name: Verify preview APK signature and permissions
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          CERTS=$("$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs Browz-Mobile-1.0.3-preview.apk)
          echo "$CERTS"
          if ! echo "$CERTS" | grep -qi "94af295478718c92fa1636a722c2b0fd68f4d64a8a0f849c96d0d28ec9f43f26"; then
            echo "ERROR: preview APK was not built with the expected historical key."
            exit 1
          fi
          PERMS=$("$BUILD_TOOLS_DIR/aapt" dump permissions Browz-Mobile-1.0.3-preview.apk)
          echo "$PERMS"
          if echo "$PERMS" | grep -E "ACCESS_FINE_LOCATION|CAMERA|RECORD_AUDIO|READ_CONTACTS"; then
            echo "ERROR: Forbidden tracking permission detected in APK!"
            exit 1
          fi

      # Signs a second APK with a key that only the repository owner holds.
      # One-time setup is documented in docs/SIGNING.md; without those secrets
      # this step does nothing and only the preview APK is produced.
      - name: Re-sign APK with owner-held key when configured
        env:
          KEYSTORE_B64: ${{ secrets.BROWZ_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.BROWZ_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BROWZ_ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.BROWZ_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No owner keystore configured; skipping owner-signed build."
            exit 0
          fi
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/browz-owner.p12"
          cp Browz-Mobile-1.0.3-preview.apk Browz-Mobile-1.0.3.apk
          zip -q -d Browz-Mobile-1.0.3.apk "META-INF/*.SF" "META-INF/*.RSA" "META-INF/*.DSA" "META-INF/*.EC" || true
          "$BUILD_TOOLS_DIR/zipalign" -f 4 Browz-Mobile-1.0.3.apk "$RUNNER_TEMP/browz-aligned.apk"
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks "$RUNNER_TEMP/browz-owner.p12" \
            --ks-pass "env:STORE_PASS" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "env:KEY_PASS" \
            --out Browz-Mobile-1.0.3.apk "$RUNNER_TEMP/browz-aligned.apk"
          rm -f "$RUNNER_TEMP/browz-owner.p12" "$RUNNER_TEMP/browz-aligned.apk"
          CERTS=$("$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs Browz-Mobile-1.0.3.apk)
          echo "$CERTS"
          if echo "$CERTS" | grep -qi "94af295478718c92fa1636a722c2b0fd68f4d64a8a0f849c96d0d28ec9f43f26"; then
            echo "ERROR: the owner key must not be the exposed historical key."
            exit 1
          fi
          echo "SHA256 (APK): $(sha256sum Browz-Mobile-1.0.3.apk | cut -d' ' -f1)"

      # The preview release carries a stable direct download link. It is marked
      # as a pre-release so it is never advertised as the latest trusted release.
      - name: Attach preview APK to the preview release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.3-preview >/dev/null 2>&1 || \
            gh release create v1.0.3-preview --prerelease --title "Browz Mobile 1.0.3 preview" \
              --notes "Unreleased Android preview signed with the historical exposed test key. Not a trusted security update. See docs/SIGNING.md."
          sha256sum Browz-Mobile-1.0.3-preview.apk > SHA256SUMS.txt
          gh release upload v1.0.3-preview Browz-Mobile-1.0.3-preview.apk SHA256SUMS.txt --clobber
          gh release view v1.0.3-preview --json url,isPrerelease,assets \
            --jq '"url=" + .url, (.assets[] | "asset=" + .name + " size=" + (.size|tostring))'

      - name: Upload preview APK (historical test key)
        uses: actions/upload-artifact@v4
        with:
          name: Browz-Mobile-1.0.3-preview-APK
          path: Browz-Mobile-1.0.3-preview.apk

      - name: Upload owner-signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Browz-Mobile-1.0.3-signed-APK
          path: Browz-Mobile-1.0.3.apk
          if-no-files-found: ignore
