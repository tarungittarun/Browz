name: Build Android Mobile APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Execute End-to-End Security & Stealth Verification Suite
        run: npm test

      - name: Setup JDK 17 for Android SDK 34
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Compile & Sign Browz Mobile APK
        run: |
          gradle assembleRelease -p android --no-daemon
          cp android/app/build/outputs/apk/release/app-release.apk Browz-Mobile-1.0.0.apk
          ls -lh Browz-Mobile-1.0.0.apk

      - name: Verify Signed APK Binary & Permissions (apksigner + aapt)
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          echo "Using Android Build Tools: $BUILD_TOOLS_DIR"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose Browz-Mobile-1.0.0.apk
          PERMS=$("$BUILD_TOOLS_DIR/aapt" dump permissions Browz-Mobile-1.0.0.apk)
          echo "$PERMS"
          if echo "$PERMS" | grep -E "ACCESS_FINE_LOCATION|CAMERA|RECORD_AUDIO|READ_CONTACTS"; then
            echo "ERROR: Forbidden tracking permission detected in APK!"
            exit 1
          fi
          echo "APK cryptographic signature and zero-telemetry permission audit passed!"

      - name: Publish Browz-Mobile-1.0.0.apk to GitHub Release (v1.0.0)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 Browz-Mobile-1.0.0.apk --clobber

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Browz-Mobile-1.0.0-APK
          path: Browz-Mobile-1.0.0.apk
