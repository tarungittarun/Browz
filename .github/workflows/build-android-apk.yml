name: Build Android Mobile APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run automated regression checks
        run: npm test

      - name: Setup JDK 17 for Android SDK 34
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Compile & Sign Browz Mobile APK
        run: |
          gradle assembleRelease -p android --no-daemon
          cp android/app/build/outputs/apk/release/app-release.apk Browz-Mobile-1.0.3-test.apk
          ls -lh Browz-Mobile-1.0.3-test.apk

      - name: Verify Signed APK Binary, Pinned Keystore Fingerprint & Permissions (apksigner + aapt)
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          echo "Using Android Build Tools: $BUILD_TOOLS_DIR"
          CERTS=$("$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs Browz-Mobile-1.0.3-test.apk)
          echo "$CERTS"
          if ! echo "$CERTS" | grep -qi "94af295478718c92fa1636a722c2b0fd68f4d64a8a0f849c96d0d28ec9f43f26"; then
            echo "ERROR: APK signing certificate SHA-256 does not match pinned browz-release.p12!"
            exit 1
          fi
          PERMS=$("$BUILD_TOOLS_DIR/aapt" dump permissions Browz-Mobile-1.0.3-test.apk)
          echo "$PERMS"
          if echo "$PERMS" | grep -E "ACCESS_FINE_LOCATION|CAMERA|RECORD_AUDIO|READ_CONTACTS"; then
            echo "ERROR: Forbidden tracking permission detected in APK!"
            exit 1
          fi
          echo "APK pinned cryptographic signature and zero-telemetry permission audit passed!"

      # Do not publish automatically: the historical release key is exposed in the repository.
      # An artifact is for testing, not a trusted production release.

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Browz-Mobile-1.0.3-test-APK
          path: Browz-Mobile-1.0.3-test.apk
