name: Android device UI smoke test
on:
  workflow_dispatch:
  push:
    branches:
      - arena/906ee2db-browz
    paths:
      - 'android/**'
      - '.github/workflows/android-device-test.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-device-test.yml'
permissions:
  contents: read
jobs:
  device-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented UI smoke test on Android 34
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: |
            set -o pipefail
            gradle connectedDebugAndroidTest -p android --no-daemon 2>&1 | tee /tmp/device.log
            STATUS=${PIPESTATUS[0]}
            if [ "$STATUS" -ne 0 ]; then
              grep -E "FAILED|Failure|junit|AssertionError|expected|Exception" /tmp/device.log | head -n 25 | tr -d '\r' | while IFS= read -r line; do
                echo "::error title=device-test::$line"
              done
            fi
            exit "$STATUS"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-test-results
          path: |
            android/app/build/outputs/androidTest-results/
            android/app/build/reports/androidTests/
          if-no-files-found: ignore
