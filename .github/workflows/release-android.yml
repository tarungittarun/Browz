name: Release Android APK (owner key required)

# Manual only. This workflow is the *only* path that can produce a release APK.
# It refuses to run without an owner-held signing key, and it fails if the
# resulting certificate matches the historical exposed key.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name to publish, e.g. 1.0.4'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Refuse to release without an owner-held key
        env:
          KEYSTORE_B64: ${{ secrets.BROWZ_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error title=signing::No owner keystore configured. Follow docs/SIGNING.md first; refusing to publish a preview key as a release."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm test

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Build unsigned payload
        run: |
          gradle assembleRelease -p android --no-daemon
          cp android/app/build/outputs/apk/release/app-release.apk release-unsigned.apk
          zip -q -d release-unsigned.apk "META-INF/*.SF" "META-INF/*.RSA" "META-INF/*.DSA" "META-INF/*.EC" || true

      - name: Sign with the owner key
        env:
          KEYSTORE_B64: ${{ secrets.BROWZ_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.BROWZ_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BROWZ_ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.BROWZ_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/owner.p12"
          "$BT/zipalign" -f 4 release-unsigned.apk release-aligned.apk
          NAME="Browz-Mobile-${{ inputs.version }}.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/owner.p12" \
            --ks-pass "env:STORE_PASS" --ks-key-alias "$KEY_ALIAS" --key-pass "env:KEY_PASS" \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out "$NAME" release-aligned.apk
          rm -f "$RUNNER_TEMP/owner.p12" release-aligned.apk release-unsigned.apk
          echo "APK=$NAME" >> "$GITHUB_ENV"

      - name: Verify the release artifact (no preview allowance)
        run: |
          # BROWZ_ALLOW_EXPOSED_KEY is deliberately unset: a release must never
          # carry the historical certificate.
          ./test/verify-apk.sh "$APK"
          sha256sum "$APK" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          "$BT/apksigner" verify --print-certs "$APK" | grep -i 'SHA-256 digest'

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ inputs.version }}"
          gh release create "$TAG" --draft --title "Browz Mobile ${{ inputs.version }}" \
            --notes "Verify the checksum and certificate fingerprint before installing. Signing certificate: see the workflow log." \
            "$APK" SHA256SUMS.txt
